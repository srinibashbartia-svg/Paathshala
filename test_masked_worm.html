<!DOCTYPE html>
<html>
<head><style>body { background: #5458F7; padding: 40px; }</style></head>
<body>
<svg width="600" height="400" viewBox="0 0 600 400" fill="none">
  <!-- Mask defining the exact rounded worm tube -->
  <defs>
    <mask id="worm-body-mask">
      <path d="M 100 260 C 120 220, 160 210, 220 240 C 300 280, 340 180, 370 120" 
            fill="none" stroke="white" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    </mask>
  </defs>

  <!-- Black outer border of worm -->
  <path d="M 100 260 C 120 220, 160 210, 220 240 C 300 280, 340 180, 370 120" 
        fill="none" stroke="#0F172A" stroke-width="49" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Masked Worm Interior (Base Violet + Indigo Stripes) -->
  <g mask="url(#worm-body-mask)">
    <!-- Solid Violet Body -->
    <rect x="0" y="0" width="600" height="400" fill="#5458F7"/>
    
    <!-- Curved Cylindrical Stripes -->
    <!-- Stripe 1 -->
    <path d="M 110 210 Q 130 230 150 250" stroke="#3730A3" stroke-width="16" stroke-linecap="round"/>
    <!-- Stripe 2 -->
    <path d="M 170 200 Q 190 225 210 250" stroke="#3730A3" stroke-width="16" stroke-linecap="round"/>
    <!-- Stripe 3 -->
    <path d="M 240 220 Q 260 250 280 270" stroke="#3730A3" stroke-width="16" stroke-linecap="round"/>
    <!-- Stripe 4 -->
    <path d="M 290 190 Q 315 210 340 230" stroke="#3730A3" stroke-width="16" stroke-linecap="round"/>
    <!-- Stripe 5 -->
    <path d="M 325 130 Q 350 150 370 170" stroke="#3730A3" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- Eyes at head (370, 120) -->
  <circle cx="362" cy="115" r="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <circle cx="364" cy="114" r="4.5" fill="#0F172A"/>
  <circle cx="362.5" cy="112" r="1.5" fill="#FFFFFF"/>

  <circle cx="378" cy="115" r="8.5" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.5"/>
  <circle cx="380" cy="114" r="4.5" fill="#0F172A"/>
  <circle cx="378.5" cy="112" r="1.5" fill="#FFFFFF"/>

  <!-- Floating Star -->
  <polygon points="370,80 373,88 381,89 375,95 377,103 370,98 363,103 365,95 359,89 367,88" 
           fill="#FFD24A" stroke="#0F172A" stroke-width="2"/>
</svg>
</body>
</html>
